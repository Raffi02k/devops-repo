name: Deploy App Service Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run Build
        run: ./scripts/build.sh

      - name: Run Tests
        run: ./scripts/test.sh

      - name: Log in to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Deploy Script
        run: ./scripts/deploy-app-service.sh "RaffiMedzadaghlian" "app-waypoint-raffi"

      - name: Run Health Check (Smoke Test)
        run: ./scripts/health-check.sh "https://azurewebsites.net"

